name: Build and publish site

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Build site
        working-directory: source
        run: npm run build

      - name: Verify deployment token is configured
        env:
          DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::Add PAGES_DEPLOY_TOKEN in the source repository's Actions secrets."
            exit 1
          fi

      - name: Check out the Pages repository
        uses: actions/checkout@v4
        with:
          repository: hooleeas/hooleeas.github.io
          ref: main
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: published-site

      - name: Replace published files with the build output
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            source/dist/ published-site/

      - name: Push build output
        working-directory: published-site
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all --force
          if git diff --cached --quiet; then
            echo "Build output is unchanged."
            exit 0
          fi
          git commit -m "Deploy site from ${SOURCE_SHA}"
          git push origin HEAD:main
